name: public-content-guard
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
permissions:
  contents: read
jobs:
  public-content-guard:
    name: public-content-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load guard for scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Trust the base copy for scanning; the self-test separately exercises the PR copy and receives no secret.
          if git cat-file -e "$BASE_SHA:scripts/public-content-guard.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/public-content-guard.py" > "$RUNNER_TEMP/public-content-guard.py"
            echo "GUARD_SOURCE=base commit $BASE_SHA" >> "$GITHUB_ENV"
            echo "Loaded guard copy from base commit $BASE_SHA for scan"
          else
            cp scripts/public-content-guard.py "$RUNNER_TEMP/public-content-guard.py"
            echo "GUARD_SOURCE=bootstrap copy from pull request content" >> "$GITHUB_ENV"
            echo "Loaded bootstrap guard copy from pull request content for scan"
          fi
      - name: Self-test pull request guard
        run: |
          echo "Running self-test against pull request guard copy"
          python3 -I scripts/public-content-guard-test.py scripts/public-content-guard.py
      - name: Scan changed files and public pull request text
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PUBLIC_DENY_LIST: ${{ secrets.PUBLIC_DENY_LIST }}
        run: |
          echo "Running scan with $GUARD_SOURCE"
          python3 -I "$RUNNER_TEMP/public-content-guard.py"
        # Fork PRs receive no secrets, so the guard intentionally fails closed.
